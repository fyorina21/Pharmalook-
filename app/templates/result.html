<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Medicine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='look.css') }}">
</head>
<body>
    <div class="container">
        <h1>Search for Medicine</h1>
        <form method="get" action="{{ url_for('routes_bp.user_homepage') }}">
            <input type="text" name="q" placeholder="Enter medicine name" value="{{ query }}">
            <button type="submit">Search</button>
        </form>

        {% if medicines %}
            <ul>
                {% for med in medicines %}
                    <li>
                        <h3>{{ med.Medicinename }}</h3>
                        <p><strong>Price:</strong> ${{ med.price }}</p>
                        <p><strong>Dosage:</strong> {{ med.Dosage }}</p>
                        <p><strong>Description:</strong> {{ med.medicinedescription }}</p>
                    </li>
                {% endfor %}
            </ul>
        {% elif query %}
            <p>No results found for "{{ query }}"</p>
        {% endif %}
    </div>
</body>
</html>
