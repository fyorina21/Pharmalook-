<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accept and Reject</title>
   <link rel="stylesheet" href="{{ url_for('static', filename='AccRej.css') }}">

</head>
<body>

  <div class="backG">
    <nav class="nav_acc_rej">
     <img src="{{ url_for('static', filename='images/photo_2025-03-31_17-08-08-removebg-preview.png') }}" class="logo">

    </nav>
  </div>

  <div class="new-pharmabox">New Pharmacies</div>

  <div class="viewer">
    {% if pharmacists %}
      {% for p in pharmacists %}
      <div class="pharmacy-request">
        <p><strong> &#9877; {{ p.name }}</strong></p>
        <p style="font-size: 80%;"> &#x1F4CD; {{ p.location }}</p>
        <p style="font-size: 80%;">📧 {{ p.email }}</p>

        <div class="actions">
          <form action="{{ url_for('auth_bp.accept_pharmacist', id=p.id) }}" method="post" style="display:inline;">
            <button type="submit" class="accept-btn">Accept</button>
          </form>
          <form action="{{ url_for('auth_bp.reject_pharmacist', id=p.id) }}" method="post" style="display:inline;">
            <button type="submit" class="reject-btn">Reject</button>
          </form>
        </div>
      </div>
      {% endfor %}
    {% else %}
      <p style="text-align: center; margin-top: 30px;">No pharmacists are signed up yet.</p>
    {% endif %}
  </div>

</body>
</html>
