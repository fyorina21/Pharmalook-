<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accept and Reject</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='AccRej.css') }}">
</head>
<body>

  <!-- Navigation Bar -->
  <div class="backG">
    <nav class="nav_acc_rej">
      <!-- Back arrow button -->
      <a href="{{ url_for('routes_bp.pdashboard') }}" class="back-arrow-icon">&#8592; Back</a>

      <!-- Logo -->
      <img src="{{ url_for('static', filename='images/photo_2025-03-31_17-08-08-removebg-preview.png') }}" class="nav-logo">
    </nav>
  </div>

  <!-- Heading for New Pharmacies -->
  <div class="new-pharmabox">New Pharmacies</div>

  <!-- Main Content -->
  <div class="viewer">
    {% if pharmacists %}
      {% for p in pharmacists %}
        <div class="pharmacy-request">
          <p><strong> {{ p.name }}</strong></p>
          <p style="font-size: 80%;">📍 {{ p.location }}</p>
          <p style="font-size: 80%;"><strong>Email: </strong>  {{ p.email }}</p>

          <div class="actions">
           <form action="{{ url_for('routes_bp.approve_pharmacy', pharmacy_id=p.id) }}" method="post">
              <button type="submit" class="accept-btn">Accept</button>
            </form>
            <form action="{{ url_for('routes_bp.reject_pharmacy', pharmacy_id=p.id) }}" method="post">
              <button type="submit" class="reject-btn">Reject</button>
            </form>
          </div>
        </div>
      {% endfor %}
    {% else %}
      <p style="text-align: center; margin-top: 30px;">No pharmacists are signed up yet.</p>
    {% endif %}
  </div>

</body>
</html>
