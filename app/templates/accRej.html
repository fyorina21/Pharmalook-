  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acc and Rej </title>
    <link rel="stylesheet" href="static/AccRej.css">
  </head>
  <body>
   <div class="backG">
    
    <nav class="nav_acc_rej">
      <img src="static/images/photo_2025-03-31_17-08-08-removebg-preview.png">
    </nav>
   </div>

<div class="new-pharmabox">New pharmacies
</div>
  {% if pharmacist %} 
   <div class="viewer"> 
      <div class="pharmacy-request">
      {% for pharmacy in pharmacist %}
        <p><strong> &#9877; {{ pharmacy.name }} </strong> </p>
        <p style="font-size: 80%;"> &#x1F4CD;
          {{ pharmacy.location }}
         </p>
      {% endfor %}


      </div>   
      <div class="actions">
        <button class="accept-btn">Accept</button>
        <button class="reject-btn">Reject</button>
      </div>
  {% else %}
      <h1> No registered pharmacies yet </h1>
    </div>
  {% endif %}
 

</body>
</html>
