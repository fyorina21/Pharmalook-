<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacist Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    <style>
        /* Reset and base styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F2FFF1;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header styles */

        .header-wrapper {
            display: flex;
            align-items: flex-start;
            margin-bottom: 30px;
        }

        .logo-container {
            height: 120px;
            margin-bottom: 10px;
            margin-right: 40px;
            display: flex;
            align-items: flex-start;
        }

        .logo {
            height: 120px;
            width: auto;
        }

        .page-title {
            font-size: 24px;
            margin: 60px 0 0 0;
        }

        .back-link {
            color: #0078d7;
            font-size: 16px;
            cursor: pointer;
            font-weight: normal;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Table styles */
        .table-container {
            /* Removed big white box styles, only center the table */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 350px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #E5FFD7;
        }

        th {
            background-color: #D6FAC8;
            
            font-weight: 600;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        /* Status styles */
        .status-pending {
            color: #ff9800;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 4px;
            background-color: #fff3e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('auth_bp.psignup') }}" class="back-link" style="position: absolute; top: 30px; right: 40px; text-decoration: none;">&larr; Back</a>
        <!-- Logo in the top left corner, perfectly aligned with the back link -->
        <!-- Logo in the top left corner, matching psignup page position -->
        <div style="position: absolute; top: -60px; left: 20px; z-index: 100; height: 210px; width: 210px; display: flex; align-items: center;">
            <img src="{{ url_for('static', filename='images/logo-bg.png') }}" alt="PharmaLook Logo" style="height: 100%; width: 100%; object-fit: contain; display: block;">
        </div>
        <div class="header-wrapper" style="margin-top: 60px;">
            <h2 class="page-title" style="margin-left: 220px; text-decoration: underline;">Request Approval Tracking Form</h2>
        </div>
        <div class="table-container" style="margin-top: -30px;">
            <table style="margin: 0 auto; width: 700px;">
                <thead>
                    <tr>
                        <th style="text-align: center;">Name</th>
                        <th style="text-align: center;">Requested date</th>
                        <th style="text-align: center;">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="text-align: center;">{{ pharmacy_name }}</td>
                        <td style="text-align: center;">{{ request_date }}</td>
                        <td style="text-align: center;">
                            {% if status == 'pending' %}
                                <span class="status-pending">pending...</span>
                            {% elif status == 'accepted' %}
                                <script>window.location.href = "{{ url_for('auth_bp.login') }}";</script>
                            {% elif status == 'rejected' %}
                                <span style="color: red; font-weight: 500;">rejected</span>
                            {% endif %}
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
